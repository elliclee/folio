name: FolioiOS
options:
  bundleIdPrefix: com.ellic
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # Local Swift package providing the portable FolioCore library.
  Folio:
    path: ../Folio

targets:
  # Target name differs from the package's "Folio" executable to avoid a
  # build-graph collision; the product itself is still named Folio.
  FolioiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: Folio
        product: FolioCore
    settings:
      base:
        PRODUCT_NAME: Folio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.ellic.folio
        MARKETING_VERSION: "0.5.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO        # simulator builds don't need signing
