name: Folio Release

# Builds the native macOS app (Folio/). Pushing a tag like `v0.5.0`
# bundles Folio.app + a .dmg and publishes them as a GitHub Release.
# Manual runs just build, test, and upload the app as an artifact.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: Folio
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Bundle app + dmg
        run: ./scripts/bundle.sh --dmg
        env:
          FOLIO_VERSION: ${{ github.ref_name }}

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folio.app
          path: Folio/dist/Folio.app

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "${GITHUB_REF_NAME}" dist/Folio.dmg --title "Folio ${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
