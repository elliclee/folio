name: Folio Release

# Builds and tests the native macOS app (Folio/). It deliberately does NOT
# publish a release: scripts/bundle.sh signs with a Developer ID certificate
# and notarizes through the App Store Connect API, and a GitHub runner has
# neither the certificate nor the credentials (scripts/.env.signing is
# gitignored — this repo is public). It would silently fall back to an
# ad-hoc signature and ship a build macOS quarantines. Releases are cut
# locally instead; see "Releasing" in Folio/README.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: Folio
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Bundle app + dmg
        run: ./scripts/bundle.sh --dmg
        env:
          FOLIO_VERSION: ${{ github.ref_name }}

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folio.app
          path: Folio/dist/Folio.app
